name: Profile Summary Cards

on:
  # refresh once a day
  schedule:
    - cron: "0 0 * * *"
  # allow running it by hand from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-summary-cards
    steps:
      - uses: actions/checkout@v4

      # generates SVG cards and commits them to profile-summary-card-output/
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          # If the cards fail to generate, create a personal access token (public_repo + read:user)
          # and store it as a repo secret named SUMMARY_GITHUB_TOKEN, then use that secret here instead.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: "main"
          TIME_ZONE: "Asia/Karachi"
          THEME: "tokyonight"
          ANIMATION: "fade"
